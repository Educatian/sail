name = "sail-api"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# D1 binding — fill database_id after `wrangler d1 create sail`
[[d1_databases]]
binding = "DB"
database_name = "sail"
database_id = "03161a20-1d52-471a-a5b8-b49c7abf3ec4"

# Secrets: `wrangler secret put LLM_API_KEY` (Gemini key or token for the mentor), `wrangler secret put RESEND_API_KEY` (email reminders)
[vars]
# Gemini via its OpenAI-compatible endpoint; set LLM_BASE_URL to use another endpoint (confirm the model name available under the UA agreement).
SAIL_MODEL = "gemini-2.5-flash"
RESEND_FROM = "SAIL <onboarding@resend.dev>"

# Daily reminder cron (16:00 UTC). Sends spacing-based metacognitive scaffold emails.
[triggers]
crons = ["0 16 * * *"]
